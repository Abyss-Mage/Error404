<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 40" role="img" aria-label="Error404">
  <!-- Mark: a red error block whose "0" is split by a glitch, with two shards torn out of its edges. -->
  <defs>
    <clipPath id="top"><rect width="40" height="20"/></clipPath>
    <clipPath id="bottom"><rect y="20" width="40" height="20"/></clipPath>
  </defs>
  <rect x="2" y="2" width="36" height="36" rx="7" fill="#ff2a3a"/>
  <g fill="none" stroke="#0b0b0c" stroke-width="5">
    <circle cx="18.5" cy="20" r="9" clip-path="url(#top)"/>
    <circle cx="22.5" cy="20" r="9" clip-path="url(#bottom)"/>
  </g>
  <rect x="0" y="26" width="10" height="3" fill="#0b0b0c"/>
  <rect x="30" y="10" width="10" height="3" fill="#0b0b0c"/>
  <text x="50" y="29" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5" fill="#f2f2f3">Error<tspan fill="#ff2a3a">404</tspan></text>
</svg>
